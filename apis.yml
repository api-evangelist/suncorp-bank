apis:
- aid: suncorp-bank:suncorp-bank-gateway-payments-api
  name: Suncorp Bank Gateway (Mastercard) Payments API
  tags:
  - Payments
  - Merchant Services
  - Card Processing
  - Mastercard Gateway
  - Partner Gated
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://suncorp.gateway.mastercard.com/api/documentation/integrationGuidelines/index.html
  baseURL: https://suncorp.gateway.mastercard.com/api/rest
  properties:
  - url: >-
      https://suncorp.gateway.mastercard.com/api/documentation/integrationGuidelines/index.html
    type: Documentation
  - url: >-
      https://suncorp.gateway.mastercard.com/api/documentation/integrationGuidelines/apiReference/apiReference.html
    type: APIReference
  description: >-
    Suncorp Bank's merchant payment gateway, a Suncorp-branded instance of Mastercard Payment Gateway
    Services (MPGS). It offers merchants a REST/JSON (and NVP) API plus hosted checkout, hosted batch,
    and mobile SDKs to authorize, capture, refund and tokenize card payments. Documented publicly at suncorp.gateway.mastercard.com/api/documentation
    (docs live, HTTP 200); the REST API itself is credentialed per-merchant (HTTP 401 without merchant
    credentials) and Mastercard publishes no downloadable OpenAPI/Swagger for MPGS, so this entry is humanURL-only
    with no machine-readable spec (partner/merchant-gated).
