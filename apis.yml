name: Suncorp Bank
kind: company
description: Suncorp Bank is an Australian retail and business bank headquartered in
  Brisbane, Queensland, offering transaction and savings accounts, home and personal
  lending, credit cards, and business banking. Formerly the banking arm of Suncorp
  Group, it was acquired by Australia and New Zealand Banking Group (ANZ) on 31 July
  2024 and now operates as a division of ANZ while retaining the Suncorp Bank brand
  under a multi-year transition. As an authorised deposit-taking institution (ADI)
  it is a data holder under Australia's Consumer Data Right (CDR / Open Banking) and
  exposes a public, unauthenticated Product Reference Data (PRD) API conforming to
  the Consumer Data Standards, powered by the Frollo PRD portal.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
