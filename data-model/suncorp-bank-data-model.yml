notes: >-
  Entity graph derived from the full CDS Banking API spec in the repo. The
  public Product Reference Data surface is rooted at BankingProduct, whose detail
  payload embeds arrays of features, constraints, eligibility, fees, and
  category-specific rate structures. The authenticated (consumer-authorized,
  mTLS) tier is rooted at BankingAccount — accounts fan out to balance, detail,
  transactions, direct debits, scheduled payments and instalment plans, with
  scheduled payments referencing a Payee. There is deliberately no id link from a
  product to an account in the CDR model (product data is a separate public surface).
